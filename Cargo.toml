[package]
name = "pg2-mm"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.0"
egui = { version = "0.33.3", default-features = false }
egui_glow = { version = "0.33.3", features = ["winit"] }
env_logger = "0.11.9"
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = { version = "0.25.9", default-features = false, features = ["rayon", "png"] }
log = "0.4.29"
nalgebra-glm = "0.20.0"
parry2d = "0.26.1"
paste = "1.0.15"
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
tinyaudio = "2.0.0"
tobj = "4.0.3"
toml = "1.0.6"
winit = "0.30.12"

assets = { path = "./crates/assets" }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.62"

[profile.release]
lto = true
codegen-units = 1
# panic = "abort"
opt-level = "s" # fast and small wasm
# debug = true
strip = true
